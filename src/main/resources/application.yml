spring:
  application:
    name: mini-autorizador-ex
  jackson:
    deserialization:
      use-big-decimal-for-floats: true
    datatype:
      json-node:
        strip-trailing-bigdecimal-zeroes: false
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/miniautorizador?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
  flyway:
    enabled: true
    validate-on-migrate: true
  jpa:
    database-platform: org.hibernate.community.dialect.MySQLLegacyDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
logging:
  level:
    org.springframework.web.servlet.mvc.method.annotation: INFO
